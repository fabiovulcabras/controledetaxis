name: Atualizar lockfile

# Gera o package-lock.json quando o package.json muda (ou sob demanda), para builds sempre com as mesmas versões.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commitar se mudou
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Atualiza package-lock.json"
            git push
          else
            echo "package-lock.json já está atualizado"
          fi
