name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  banco:
    name: Regras do banco (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Schema e cenários de teste
        run: bash supabase/tests/run.sh

  app:
    name: Bot, tipos e build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-exemplo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependências
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Testes do bot
        run: npm test
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Build
        run: npm run build
